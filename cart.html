<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your Toy Haven shopping cart.">
  <meta name="theme-color" content="#172554">
  <title>Toy Haven | Shopping Cart</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <header class="site-header">
    <a class="brand" href="index.html">TOY HAVEN</a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a>
      <a class="active" href="cart.html">Cart <span class="cart-count">0</span></a><a href="support.html">Support</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-intro reveal">
      <p class="eyebrow">YOUR PICKS</p>
      <h1>Shopping Cart</h1>
      <p>Check your items before heading to checkout.</p>
    </section>

    <section class="cart-layout section compact-section">
      <div>
        <div id="cart-items" class="cart-list"></div>
        <div id="empty-cart" class="empty-state hidden">
          <h2>Your cart is empty</h2>
          <p>Add a few favourites from the collection.</p>
          <a class="btn" href="products.html">Browse products</a>
        </div>
      </div>
      <aside class="summary-card">
        <h2>Order Summary</h2>
        <div class="summary-line"><span>Items</span><strong id="cart-item-count">0</strong></div>
        <div class="summary-line"><span>Subtotal</span><strong id="cart-subtotal">$0.00</strong></div>
        <hr>
        <div class="summary-total"><span>Total</span><strong id="cart-total">$0.00</strong></div>
        <a id="checkout-link" class="btn full-width" href="checkout.html">PROCEED TO CHECKOUT</a>
        <button id="clear-cart" class="btn secondary full-width">CLEAR CART</button>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
