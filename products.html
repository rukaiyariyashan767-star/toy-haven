<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse Toy Haven products.">
  <meta name="theme-color" content="#172554">
  <title>Toy Haven | Products</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <header class="site-header">
    <a class="brand" href="index.html">TOY HAVEN</a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a class="active" href="products.html">Products</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-intro reveal">
      <p class="eyebrow">FIND SOMETHING FUN</p>
      <h1>Explore Our Collection</h1>
      <p>Find something fun, collectible and worth keeping.</p>
    </section>

    <section class="catalog-controls reveal" aria-label="Product filters">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="product-search" type="search" placeholder="Search products..." autocomplete="off">
      </label>
      <div id="category-filters" class="filter-list">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Figurines">Figurines</button>
        <button class="filter-btn" data-category="Toys">Toys</button>
        <button class="filter-btn" data-category="Board Games">Board Games</button>
        <button class="filter-btn" data-category="Diecast Cars">Diecast Cars</button>
      </div>
    </section>

    <section class="section compact-section">
      <div class="results-row">
        <h2>Products</h2>
        <span id="product-result-count" class="muted"></span>
      </div>
      <div id="product-grid" class="product-grid"></div>
      <p id="no-products" class="empty-state hidden">No products match your search.</p>
    </section>
  </main>

  <div id="product-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal aria-label="Close product details">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
